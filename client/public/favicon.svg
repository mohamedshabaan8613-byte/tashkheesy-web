<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2BBDB6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E4E8C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#bg)"/>
  <!-- Subtle leaf/growth hint - minimal arc top-right -->
  <path d="M 44 8 Q 56 8 56 20 Q 50 12 44 12 Z" fill="#FFFFFF" opacity="0.12"/>
  <!-- Arabic letter "ت" - clean, minimal, premium -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="Cairo, 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="28"
    fill="#FFFFFF"
  >ت</text>
</svg>
