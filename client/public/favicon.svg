<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2BBDB6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E4E8C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4EFE8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#DFF3F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Subtle leaf/growth hint - very minimal arc at top-left -->
  <path d="M 14 18 Q 14 10 22 10 Q 18 14 18 18 Z" fill="url(#leaf)" opacity="0.5"/>
  <!-- Arabic letter "ت" - clean, minimal, premium -->
  <text
    x="32"
    y="44"
    text-anchor="middle"
    font-family="Cairo, 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="30"
    fill="#FFFFFF"
    letter-spacing="-0.5"
  >ت</text>
  <!-- Two dots of "ت" - already included in the letter, but adding subtle refinement dots -->
</svg>
