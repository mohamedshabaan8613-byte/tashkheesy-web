# Sprint 3.7.2 — PR Safety Gate (UPDATED)
#
# CHANGE LOG (3.7.2):
#   REMOVED: curl exec_sql migration hack in migration-probe job
#   REPLACED: migration-probe now uses supabase CLI + psql to verify schema
#
# This is the SINGLE required status check for branch protection on main.
# PR is blocked if ANY job fails.

name: 'PR Safety Gate — Sprint 3.7'

on:
  pull_request:
    branches: [ main, feat/sprint-* ]

jobs:
  # ── Gate 1: TypeScript ──────────────────────────────────────
  type-check:
    name: '[Gate] TypeScript'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: TypeScript type check
        run: pnpm tsc --noEmit

  # ── Gate 2: Migration Schema Verification (CLI-based) ───────
  migration-probe:
    name: '[Gate] Migration Schema via Supabase CLI'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            --password     ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Stage + push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p supabase/migrations
          cp supabase/sql/011_sprint36_m2_reschedule.sql \
             supabase/migrations/20260520000011_sprint36_m2_reschedule.sql
          cp supabase/sql/012_atomic_reschedule_transaction.sql \
             supabase/migrations/20260521000012_atomic_reschedule_transaction.sql
          supabase db push --linked --include-all \
            --password ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify atomic_reschedule function in pg_proc
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          COUNT=$(psql \
            -h ${{ secrets.SUPABASE_DB_HOST }} \
            -U postgres -d postgres \
            -tAc "SELECT COUNT(*) FROM pg_proc WHERE proname = 'atomic_reschedule';")
          if [ "$COUNT" -lt "1" ]; then
            echo "::error::atomic_reschedule function not found."
            exit 1
          fi
          echo "atomic_reschedule verified in pg_proc (count=$COUNT)."

      - name: Verify lifecycle_version + reschedule_count columns
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for COL in lifecycle_version reschedule_count; do
            COUNT=$(psql -h ${{ secrets.SUPABASE_DB_HOST }} -U postgres -d postgres \
              -tAc "SELECT COUNT(*) FROM information_schema.columns \
                    WHERE table_name='consultations' AND column_name='$COL';")
            if [ "$COUNT" -lt "1" ]; then
              echo "::error::Column $COL missing from consultations."
              exit 1
            fi
            echo "Column $COL verified."
          done

  # ── Gate 3: Integration Tests ───────────────────────────────
  integration-gate:
    name: '[Gate] Integration Tests'
    runs-on: ubuntu-latest
    environment: dev
    needs: [type-check, migration-probe]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Atomic Reschedule Integration Tests
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pnpm jest \
            --testPathPattern='__tests__/integration/atomicReschedule\.integration\.test\.ts' \
            --forceExit --detectOpenHandles --verbose

      - name: Realtime Sync Integration Tests
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pnpm jest \
            --testPathPattern='__tests__/integration/realtimeSynchronization\.integration\.test\.ts' \
            --forceExit --detectOpenHandles --verbose

  # ── Final gate ──────────────────────────────────────────────
  all-gates-passed:
    name: '✅ All Validation Gates Passed'
    runs-on: ubuntu-latest
    needs: [type-check, migration-probe, integration-gate]
    if: success()
    steps:
      - run: echo "All Sprint 3.7 validation gates passed. PR may proceed to architectural review."
