# Sprint 3.7.1 — Type Safety Gate
# Blocks merge if TypeScript compilation fails.

name: 'TypeScript Type Check'

on:
  pull_request:
    branches: [ main, feat/sprint-* ]
    paths:
      - 'client/src/**/*.ts'
      - 'client/src/**/*.tsx'
      - 'client/tsconfig.json'
      - 'tsconfig*.json'

jobs:
  type-check:
    name: 'pnpm tsc --noEmit'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm tsc --noEmit
